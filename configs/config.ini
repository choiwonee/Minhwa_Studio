[Settings]
    default_save_path = ./outputs
    enable_logging = True
    
    # [인증 키 관리]
    # 1. Hugging Face Token (Hugging Face 모델 허브 액세스용), 토큰 값은 따옴표 없이 입력
    hf_token = ""
    
    # 2. Remote/Google API Key, Google GenAI 등 외부 API 사용 시
    api_key = ""
    
    enable_4bit = True
    # Pascal GPU 전용 설정
    pascal_safe_mode = True    # GTX 10xx 시리즈 보호 모드
    # 프롬프트 길이 제한 (단어 기준)
    max_prompt_words = 75
    max_prompt_words_gemini = 2000    # Gemini 모델
    max_prompt_words_qwen = 2000    # Qwen 계열
    
    # AI 모델 가중치 파일 저장 경로
    weights_path = ./models/weights
    
    # RealESRGAN 다운로드 URL
    realesrgan_url = https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
    # 거대 모델 여부 판별 키워드 (Qwen만 유지)
    heavy_model_keywords = qwen

[RemoteAPISettings]
    max_image_size = 768
    timeout_seconds = 180
    max_retries = 3
    inference_steps = 28

# =====================================================================================================================
# [AspectRatios] 종횡비 설정 섹션
# =====================================================================================================================
[AspectRatios]
    1:1 = 1.0
    2:3 = 0.66
    3:2 = 1.5
    3:4 = 0.75
    4:3 = 1.33
    4:5 = 0.8
    5:4 = 1.25
    9:16 = 0.56
    16:9 = 1.77
    21:9 = 2.33
    9:21 = 0.43

# =====================================================================================================================
# [Models] 간소화된 모델 정의 섹션
# =====================================================================================================================
[Models]
    # -------------------------------------------------------------------------------------
    # 1. SAM2 Models (완전 복구)
    # -------------------------------------------------------------------------------------
    [[sam2]]
        [[[sam2_hiera_large]]]
            short_name = SAM2 Large
            use = True
            repo_id = facebook/sam2-hiera-large
            mode = local
            pipeline_type = default
            default = True
            description = Highest accuracy, heavy VRAM
        
        [[[sam2_hiera_base_plus]]]
            short_name = SAM2 Base+
            use = True
            repo_id = facebook/sam2-hiera-base-plus
            mode = local
            pipeline_type = default
        
        [[[sam2_hiera_small]]]
            short_name = SAM2 Small
            use = True
            repo_id = facebook/sam2-hiera-small
            mode = local
            pipeline_type = default
        
        [[[sam2_hiera_tiny]]]
            short_name = SAM2 Tiny
            use = True
            repo_id = facebook/sam2-hiera-tiny
            mode = local
            pipeline_type = default
    
    # -------------------------------------------------------------------------------------
    # 2. Depth Models (완전 복구)
    # -------------------------------------------------------------------------------------
    [[depth]]
        [[[depth_anything_v2]]]
            short_name = Depth Anything V2
            use = True
            repo_id = depth-anything/Depth-Anything-V2-Large-hf
            mode = local
            pipeline_type = default
            default = True
        
        [[[marigold_depth]]]
            short_name = Marigold Depth
            use = True
            repo_id = prs-eth/marigold-depth-hr-v1-1
            mode = local
            pipeline_type = default
    
    # -------------------------------------------------------------------------------------
    # 3. Generation Models (Gemini, Qwen, DreamShaper 만 유지)
    # -------------------------------------------------------------------------------------
    [[generation]]
        [[[image_to_image]]]
            [[[[gemini-3-pro-image-preview]]]]
                short_name = Gemini-3-Pro (API)
                use = True
                repo_id = None
                pipeline_type = None
                default = True
                mode = remote
                remote_url = https://generativelanguage.googleapis.com
                provider = google_genai
                api_model_uri = gemini-3-pro-image-preview
                queue_uri = None
                prompt_mode = mix_way
                prompt_style = instruction
                accepts_negative = False
                accepts_image = True
                accepts_mask = True
                options = multi-image, multi-angle, high_vram, steps=40, guidance=1.0, temperature=0.2
                vram_requirement = 12.0
                fallback_precision = float16
                description = Instruction-based Editing. Requires Image.
            
            [[[[qwen_edit_2511_fal]]]]
                short_name = Qwen-Edit 2511 (Fal-AI)
                use = True
                repo_id = fal/Qwen-Image-Edit-2511-Multiple-Angles-LoRA
                pipeline_type = QwenImageEditNative
                mode = remote
                remote_url = fal/Qwen-Image-Edit-2511-Multiple-Angles-LoRA
                provider = fal_ai
                api_model_uri = https://router.huggingface.co/fal-ai/fal-ai/qwen-image-edit-2511/lora
                queue_uri = ?_subdomain=queue
                prompt_mode = mix_way
                prompt_style = instruction
                accepts_negative = False
                accepts_image = True
                accepts_mask = False
                options = multi-angle, high_vram, steps=28, guidance=1.0
                vram_requirement = 0.0
                description = Powered by fal-ai Inference Provider. Supports Multi-Angle LoRA.
            
            [[[[qwen_edit_2511]]]]
                short_name = Qwen-Edit 2511 (hf_space)
                use = False
                repo_id = Qwen/Qwen-Image-Edit-2511
                pipeline_type = QwenImageEditNative
                mode = remote
                remote_url = https://qwen-qwen-image-edit-2511.hf.space
                provider = hf_space
                api_model_uri = /infer
                queue_uri = None
                prompt_mode = mix_way
                prompt_style = instruction
                accepts_negative = False
                accepts_image = True
                accepts_mask = False
                options = multi-image, high_vram, steps=20, guidance=1.0, true_cfg_scale=4.0
                vram_requirement = 12.0
                fallback_precision = float16
                description = Qwen 2511 with Multi-Image Support. High-performance GPU required.
            
            [[[[dreamshaper_8]]]]
                short_name = DreamShaper 8
                use = True
                repo_id = Lykon/dreamshaper-8-inpainting
                pipeline_type = SDInpaint
                default = True
                mode = local
                accepts_image = True
                accepts_mask = True
                options = steps=30, guidance=7.5
                vram_requirement = 3.5
                description = Stable Diffusion 1.5 Inpainting. Fast & Stable.
        
        [[[text_to_image]]]
# 순수 텍스트 생성 모델은 비워둡니다.

# =====================================================================================================================
# [Scenarios] 한국어 기반 고서화/민화 배경 합성 시나리오
# ConfigObj Multi-line String: 긴 텍스트는 """ """를 사용하여 멀티라인으로 작성
# =====================================================================================================================
[Scenarios]
    [[궁궐_후원]]
        label = 🏯 궁궐 후원 (Royal Garden)
        prompt = '''
    조선시대 궁중 회화(궁중화) 스타일의 정교하고 장식적인 배경. 
    피사체 뒤로 육각형 목조 정자와 부드럽게 휜 처마가 있는 고요한 연못이 펼쳐진 왕실의 후원 풍경. 
    오래된 비단 캔버스 질감 위에 천연 광물 안료를 사용한 듯한 색감과 정밀한 붓터치가 특징이다. 
    오래된 소나무 사이로 은은한 햇살이 비치며 부드러운 그림자를 드리운다. 
    현대적인 요소 없이 역사적인 깊이감과 우아한 대칭미를 강조하여 그렸다.
    '''
        negative = '''
    사진 같은 사실주의, 3D 렌더링, 현대식 건물, 콘크리트, 서양식 원근법, 
    유화 질감, 네온 컬러, 텍스트, 워터마크, 인물, 자동차
    '''
        tags = 궁중회화, 비단채색, 정자, 연못
    
    [[산수_배경]]
        label = ⛰️ 산수화 (Mountain Landscape)
        prompt = '''
    웅장한 한국의 전통 수묵 산수화 배경. 
    안견이나 정선의 화풍처럼, 안개와 구름에 싸인 화강암 봉우리가 원경을 압도한다. 
    뒤틀리고 거친 소나무가 바위 절벽에 매달려 있으며, 붓의 속도와 힘이 느껴지는 힘찬 먹 선으로 표현되었다. 
    거친 닥나무 한지의 질감이 그대로 느껴지며, 다양한 농담의 검은 먹 번짐을 통해 깊이 있는 대기 원근감을 묘사했다. 
    자연 속에 홀로 있는 듯한 고독하고 광활한 분위기.
    '''
        negative = '''
    알록달록한 색감, 서양식 풍경화, 밥 로스 스타일, 사진, 
    평면적인 채색, 벡터 아트, 낮은 품질, 건물, 전봇대
    '''
        tags = 수묵산수, 진경산수, 소나무, 운무
    
    [[사랑_내실]]
        label = 📜 사랑방/내실 (Scholar's Room)
        prompt = '''
    조선시대 선비의 사랑방 같은 차분하고 지적인 실내 배경. 
    한지 문과 창호를 통해 은은하고 따뜻한 햇살이 투과되어 방 안을 부드럽게 감싼다. 
    배경에는 낮은 목조 서안(책상), 실로 묶은 고서적들, 그리고 은은한 글씨나 그림이 있는 병풍이 배치되어 있다. 
    전반적으로 따뜻한 흙색, 나무의 결, 종이의 미색이 주조를 이룬다. 
    김홍도의 풍속화 스타일처럼 가는 먹선과 맑은 담채로 묘사되어 고풍스러운 느낌을 준다.
    '''
        negative = '''
    현대식 가구, 전등, 전기 조명, 유리 창문, 플라스틱, 
    서양식 인테리어, 반짝이는 금속, 강한 대비, TV, 컴퓨터
    '''
        tags = 책가도, 문방사우, 한옥내부, 온돌
    
    [[월하_정취]]
        label = 🌕 월하 정취 (Moonlight Garden)
        prompt = '''
    보름달의 부드럽고 신비로운 빛에 잠긴 서정적인 야경 그림. 
    이끼와 양치류로 뒤덮인 낡은 석등 하나가 어스름한 정원에 고요히 서 있다. 
    깊은 남색과 먹의 번짐 기법을 사용하여 어두운 밤을 표현하고, 종이의 흰 여백을 살려 달빛이 비치는 효과를 냈다. 
    여름밤의 습기를 머금은 듯한 축축하고 몽환적인 분위기를 헐거운 붓터치로 표현했다. 
    피사체를 압도하지 않으면서 신비로운 운치를 더해주는 배경.
    '''
        negative = '''
    대낮, 태양, 밝은 원색, 가로등, 사이버펑크, 렌즈 플레어, 
    선명한 초점, 디지털 아트, 노이즈
    '''
        tags = 야경, 석등, 수묵담채, 여백의미
    
    [[대나무_숲]]
        label = 🎍 대나무 숲 (Bamboo Forest)
        prompt = '''
    선비의 절개를 상징하는 울창하고 곧은 대나무 숲 배경, 사군자 스타일. 
    수묵화 기법으로 그려진 대나무 줄기들이 리듬감 있게 수직으로 뻗어 있다. 
    잎은 짙고 힘찬 농묵(진한 먹)으로, 줄기는 옅고 메마른 갈필로 표현하여 한지 위에서의 질감 대비를 강조했다. 
    대나무 아래쪽에는 옅은 안개가 감돌며 빛과 그림자의 패턴을 만든다.
    '''
        negative = '''
    열대 우림, 야자수, 알록달록한 꽃, 실사 사진, 3D 모델링, 
    가로 구도, 복잡한 덩굴 식물
    '''
        tags = 사군자, 묵죽도, 선비정신, 수묵
    
    [[단풍_절경]]
        label = 🍁 단풍 절경 (Autumn Valley)
        prompt = '''
    붉은색과 황토색으로 불타오르는 듯한 가을 단풍 계곡의 절경, 진경산수화 스타일. 
    붉은 단풍잎들이 이끼 낀 바위와 흐르는 시냇물을 배경으로 바람에 흩날린다. 
    물결은 전통 회화 특유의 구불구불한 선으로 묘사되었다. 
    현대 디지털 아트의 쨍한 색감이 아니라, 천연 염료가 오래된 종이 위에서 바랜 듯한 빈티지하고 차분한 색감을 사용했다. 
    늦가을 깊은 산속을 거니는 듯한 정취.
    '''
        negative = '''
    초록색 여름, 눈 내린 겨울, 봄꽃, 형광 빨강, 벡터 일러스트, 
    서양식 공원, 아스팔트, 등산객
    '''
        tags = 가을산수, 단풍, 계곡, 채색화
    
    [[매화_정원]]
        label = 🌸 매화 정원 (Plum Blossoms)
        prompt = '''
    기존 그림 중앙에 말탄 동자 객체 마스크에 같이 합성할 것이다. 
    한국의 전통 회화, 민화 스타일의 질감, 채색, 명도, 채도, 명암 반영한 이른 봄, 오래되고 뒤틀린 매화나무 가지에 섬세한 흰색과 분홍색 꽃이 만개한 정원 배경. 
    윤곽선 없이 색채로만 형태를 그리는 '몰골법'을 사용하여 꽃잎을 부드럽게 표현하고, 거친 먹으로 표현된 나무껍질과 대비를 주었다. 
    아직 녹지 않은 잔설이 살짝 남아 있어 차갑고 맑은 공기가 느껴진다. 
    복잡하지 않고 여백의 미를 충분히 살려 피사체를 우아하게 돋보이게 한다.
    '''
        negative = '''
    현대식 사진, 만개한 여름 꽃, 열대 꽃, 복잡한 배경, 빽빽함, 서양 유화, 
    두꺼운 물감 칠, 벌레, 동물
    '''
        tags = 매화, 탐매도, 설중매, 봄
    
    [[연못_정자]]
        label = 🛖 연못과 정자 (Lotus Pond Villa)
        prompt = '''
    자연과 조화를 이루는 은둔 선비의 별서 정원 풍경. 
    소박한 초가 지붕 혹은 기와 지붕의 정자가 넓은 연잎과 연꽃으로 덮인 고요한 연못을 내려다보고 있다. 
    수면은 하늘과 가장자리에 늘어진 버드나무를 비추며, 물기를 머금은 듯한 수묵 담채 기법으로 부드럽게 묘사되었다. 
    닥나무 한지에 먹이 살짝 번지는 듯한 흡수성을 시각적으로 표현하여 차분하고 명상적인 분위기를 자아낸다.
    '''
        negative = '''
    화려한 궁전, 서양식 성, 수영장, 콘크리트 경계석, 현대식 공원, 
    피크닉, 오리 배, 관광객
    '''
        tags = 별서정원, 연꽃, 소쇄원, 수묵담채

# =====================================================================================================================
# [RAG_Templates] RAG 기반 민화 프롬프트 최적화 지시문 및 템플릿
# 주의: prompt_template 내의 JSON 예시 중괄호는 파이썬의 .format() 메서드를 사용하여 
#      변수({user_input}, {evidence})를 주입 에러 방지를 위해 반드시 {{ }} 로 이중 처리해야 한다.
# =====================================================================================================================
[RAG_Templates]
    instructions = '''
    너는 '한국 전통 회화(조선 민화 포함)' 전용 프롬프트 엔지니어다.
    사용자의 지시를 분석하여 고전 회화 합성에 최적화된 5가지 항목으로 분리해라.
    아래 '레시피(근거)'는 규칙이다. 근거에 없는 스타일을 추정해서 추가하지 마라.
    다음을 절대 금지한다: 동화책/아동 일러스트, 실사/시네마틱, 텍스트/워터마크, 현대 오브젝트.
    출력은 오직 JSON 1개만 반환해라.
    JSON 스키마: {"keep": "...", "change": "...", "add": "...", "style_anchors": "...", "negative": "..."}
    - keep: 원본에서 형태/질감을 그대로 유지해야 할 요소 (명사 위주, 영어로 번역).
    - change: 새롭게 변경되거나 대체될 요소 (동사구 포함, 영어로 번역).
    - add: 새롭게 덧붙여질 추가 요소 (명사 위주, 영어로 번역, 없으면 'none').
    - style_anchors: 근거를 바탕으로 한 전통 회화 스타일 키워드 (쉼표 구분, 영어).
    - negative: 금지 요소를 쉼표로 나열 (영어).
    추가 설명이나 마크다운 코드블록을 절대 붙이지 마라.
    중요: 사용자가 카메라 각도를 지정하면, 평면적인 민화 기법을 유지하되 오브젝트의 배치와 원근감을 조절하여 해당 각도를 시각적으로 명확히 표현해라.
    결과는 반드시 보편적이고 전형적인 조선 민화의 양식을 따르도록 구성해라.
    '''
    
    prompt_template = '''
    [사용자 입력]
    {user_input}

    [레시피(근거) - 반드시 준수]
    {evidence}

    작업 지시:
    1) 사용자의 요청을 분석하여 keep, change, add 로 세분화해라.
